<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Metaetiqueta crucial para Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Básico -->
    <title>Scudery | Seguridad que nace en las personas</title>
    <meta name="description" content="En SCUDERY desarrollamos una cultura de seguridad con enfoque en el Humanware. Convirtiendo al factor humano en la principal línea de defensa.">
    <meta name="keywords" content="ciberseguridad, humanware, cultura de seguridad, capacitación, SCUDERY">
    <link rel="canonical" href="https://scudery.digital">

    <!-- Open Graph (Para que se vea bien al compartir en LinkedIn/WhatsApp) -->
    <meta property="og:title" content="SCUDERY">
    <meta property="og:description" content="Seguridad que nace en las personas.">
    <meta property="og:image" content="logo.png">

    <style>
        :root {
            --primary-color: #212529;
            --secondary-color: #6c757d;
            --bg-color: #f8f9fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--primary-color);
            line-height: 1.6;
        }

        /* Contenedor principal para control de ancho */
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 100%;
            max-width: 850px;
            height: auto;
            margin-bottom: 2rem;
            /* Mejora de carga: evita saltos de diseño */
            aspect-ratio: 3 / 1; 
            object-fit: contain;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem); /* Texto fluido según pantalla */
            margin-bottom: 1rem;
            font-weight: 700;
        }

        p {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--secondary-color);
            margin: 0 auto 2rem auto;
            max-width: 650px;
        }

        /* Elemento decorativo o botón opcional */
        .badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            background-color: #e9ecef;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #495057;
            margin-bottom: 1rem;
        }

        /* Media Queries adicionales si fueran necesarias */
        @media (max-width: 680px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- SEO: El atributo alt debe tener el nombre de la marca -->
        <img src="logo.png" alt="Logo de Scudery - Humanware" class="logo">
     
        
        <!-- SEO: Uso de H1 para la palabra clave principal -->
        <h1>Seguridad que nace en las personas.</h1>
        
        <p>
            Estamos construyendo una cultura de seguridad con <strong>Corazón Humano</strong>. 
            Vuelve pronto para descubrir nuestras novedades.
        </p>
    </main>

</body>
</html>
